<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- White rounded square background -->
  <rect width="48" height="48" rx="10" fill="white"/>
  <!-- Diamond mortarboard top board -->
  <polygon points="24,5 43,18 24,29 5,18" fill="#0F172A"/>
  <!-- Cap crown below board -->
  <rect x="18" y="28" width="12" height="9" rx="2" fill="#0F172A"/>
  <!-- Tassel string from left corner -->
  <line x1="5" y1="18" x2="5" y2="39" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="5" cy="42" r="2.5" fill="#0F172A"/>
</svg>
