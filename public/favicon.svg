<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- White background -->
  <rect width="48" height="48" rx="10" fill="white"/>
  <!-- Magnifying glass ring: evenodd donut, center (20,20), outer r=15, inner r=10 -->
  <path fill-rule="evenodd" fill="#0F172A"
    d="M5 20 A15 15 0 0 0 35 20 A15 15 0 0 0 5 20 Z
       M10 20 A10 10 0 0 0 30 20 A10 10 0 0 0 10 20 Z"/>
  <!-- Handle -->
  <line x1="29" y1="29" x2="44" y2="44" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Graduation cap — centered in lens interior -->
  <!-- Cap top (mortarboard square) -->
  <rect x="16" y="16" width="8" height="5.5" rx="1" fill="#0F172A"/>
  <!-- Cap board (wide flat brim) -->
  <rect x="12.5" y="22" width="15" height="2.5" rx="0.5" fill="#0F172A"/>
</svg>
